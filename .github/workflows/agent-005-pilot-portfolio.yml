name: AGENT-005 Pilot Portfolio

on:
  pull_request:
    paths:
      - 'templates/scripts/agent_*metric.py'
      - 'templates/scripts/audit-portfolio.py'
      - 'templates/scripts/audit-core.py'
      - 'templates/agent-eval/**'
      - '.github/workflows/agent-005-pilot-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenForge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openforge

      # Pilot refs are intentionally isolated here. Downstream repositories do
      # not depend on an unmerged OpenForge branch; this workflow only validates
      # the current cross-project pilot contract before a stable OpenForge tag.
      - name: Checkout Narwhal pilot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dasomel/narwhal
          ref: feat/openforge-agent-ops
          path: pilots/narwhal

      - name: Checkout KubeMetal pilot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dasomel/kubemetal
          ref: feat/openforge-agent-ops
          path: pilots/kubemetal

      - name: Checkout nfs-quota-agent pilot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dasomel/nfs-quota-agent
          ref: feat/openforge-agent-ops
          path: pilots/nfs-quota-agent

      - name: Audit AGENT-005 pilot portfolio
        shell: bash
        run: |
          set -euo pipefail
          python3 openforge/templates/scripts/audit-portfolio.py \
            --config openforge/templates/agent-eval/portfolio.pilots.yml \
            --json-out /tmp/agent005-pilots.json \
            --scorecard-en /tmp/agent005-pilots.md \
            --scorecard-ko /tmp/agent005-pilots-ko.md \
            --issues-dir /tmp/agent005-issues

      - name: Require AGENT-005 across all pilots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/agent005-pilots.json', encoding='utf-8'))
          assert report['metricSetVersion'] == '2026.10', report.get('metricSetVersion')
          expected = {'narwhal', 'kubemetal', 'nfs-quota-agent'}
          seen = set()
          for repo in report['results']:
              if repo['id'] not in expected:
                  continue
              seen.add(repo['id'])
              check = next(c for c in repo['checks'] if c['metricId'] == 'AGENT-005')
              print(f"{repo['id']}: AGENT-005={check['score']} — {check['evidence']}")
              assert check['score'] == 2, (repo['id'], check)
          assert seen == expected, (seen, expected)
          PY
