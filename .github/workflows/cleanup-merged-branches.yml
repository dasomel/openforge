name: Cleanup merged branches

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  sweep-merged-heads:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete only branches proven identical to merged PR heads
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          owner = os.environ["REPOSITORY_OWNER"]
          default_branch = os.environ["DEFAULT_BRANCH"]
          api = os.environ["API_URL"].rstrip("/")
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else None

          branches = []
          page = 1
          while True:
              batch = request(f"{api}/repos/{repository}/branches?per_page=100&page={page}")
              if not batch:
                  break
              branches.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          deleted = []
          skipped = []
          for branch in branches:
              name = branch["name"]
              sha = branch["commit"]["sha"]
              if name == default_branch or branch.get("protected") or name.startswith("release/"):
                  skipped.append((name, "default/protected/release"))
                  continue
              head = urllib.parse.quote(f"{owner}:{name}", safe="")
              if request(f"{api}/repos/{repository}/pulls?state=open&head={head}&per_page=100"):
                  skipped.append((name, "open-pr"))
                  continue
              closed_prs = request(f"{api}/repos/{repository}/pulls?state=closed&head={head}&per_page=100")
              proven = any(
                  pr.get("merged_at")
                  and pr.get("head", {}).get("sha") == sha
                  and pr.get("head", {}).get("repo", {}).get("full_name") == repository
                  for pr in closed_prs
              )
              if not proven:
                  skipped.append((name, "no-exact-merged-pr-head-proof"))
                  continue
              encoded = urllib.parse.quote(name, safe="")
              try:
                  request(f"{api}/repos/{repository}/git/refs/heads/{encoded}", method="DELETE")
                  deleted.append(name)
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise
          print("deleted:", json.dumps(deleted, ensure_ascii=False))
          print("retained:", json.dumps(skipped, ensure_ascii=False))
          PY
