name: Temporary Agent Behavior Foundation V2

on:
  push:
    branches: [release/agent-behaviors-v2]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/agent-behaviors-v2
      - name: Register AGENT-004 on current audit engine
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('templates/scripts/audit-portfolio.py')
          text = p.read_text()
          marker = '\nif __name__ == "__main__":\n    main()\n'
          block = '''\ndef _register_agent_behavior_metric() -> None:\n    """Attach additive AGENT-004 without replacing the current audit core."""\n    import importlib.util\n    from types import SimpleNamespace\n\n    module_path = Path(__file__).with_name("agent_behavior_metric.py")\n    spec = importlib.util.spec_from_file_location("openforge_agent_behavior_metric", module_path)\n    module = importlib.util.module_from_spec(spec)\n    assert spec.loader is not None\n    spec.loader.exec_module(module)\n\n    core = SimpleNamespace(\n        METRIC_DEFINITIONS=METRIC_DEFINITIONS,\n        RepoAuditor=RepoAuditor,\n        validate_portfolio_config=validate_portfolio_config,\n        run_portfolio_audit=run_portfolio_audit,\n        compare_with_baseline=compare_with_baseline,\n    )\n    module.register(core)\n    globals()["validate_portfolio_config"] = core.validate_portfolio_config\n    globals()["run_portfolio_audit"] = core.run_portfolio_audit\n    globals()["compare_with_baseline"] = core.compare_with_baseline\n\n\n_register_agent_behavior_metric()\n\n\nif __name__ == "__main__":\n    main()\n'''
          if '_register_agent_behavior_metric()' not in text:
              if marker not in text:
                  raise SystemExit('audit-portfolio.py main marker not found')
              text = text.replace(marker, '\n' + block)
              p.write_text(text)

          t = Path('tests/test_portfolio_audit.py')
          s = t.read_text()
          s = s.replace('Verify all 35 standard metrics', 'Verify all 36 standard metrics')
          s = s.replace('self.assertEqual(len(metrics), 35, f"Expected exactly 35 metrics, got {len(metrics)}")', 'self.assertEqual(len(metrics), 36, f"Expected exactly 36 metrics, got {len(metrics)}")')
          t.write_text(s)
          PY
      - name: Verify foundation
        shell: bash
        run: |
          set -euo pipefail
          bash templates/scripts/validate-behaviors.sh
          python3 -m unittest discover -s tests -v
          python3 templates/scripts/audit-portfolio.py --config tests/fixtures/compliance/portfolio.yml --summary-only
      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add templates/scripts/audit-portfolio.py tests/test_portfolio_audit.py
          git commit -m 'feat(agent): register AGENT-004 with current audit engine'
          git push origin HEAD:release/agent-behaviors-v2
