name: Temporary Reconstruct Agent Behavior Foundation

on:
  push:
    branches: [release/agent-behaviors-current]

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/agent-behaviors-current
          fetch-depth: 0
      - name: Merge foundation history while preserving current-main conflict ownership
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/agent-behaviors
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit -X ours origin/feat/agent-behaviors
          git push origin HEAD:release/agent-behaviors-current
