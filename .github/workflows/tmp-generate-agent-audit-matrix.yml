name: Temporary Agent Audit Matrix Generation

on:
  push:
    branches: [feat/agent-audit-matrix]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/agent-audit-matrix
      - name: Clone priority repositories at current main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent-audit
          repos=(narwhal narwhal-portal beluga beluga-manager kubemetal clusterdeck ldapium nfs-quota-agent egovframe-launcher kube-ready-box)
          for repo in "${repos[@]}"; do
            git clone --depth=1 "https://github.com/dasomel/${repo}.git" "/tmp/agent-audit/${repo}"
          done
      - name: Generate revision-bound matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 templates/scripts/generate-agent-audit-matrix.py \
            --repo dasomel/narwhal=/tmp/agent-audit/narwhal \
            --repo dasomel/narwhal-portal=/tmp/agent-audit/narwhal-portal \
            --repo dasomel/beluga=/tmp/agent-audit/beluga \
            --repo dasomel/beluga-manager=/tmp/agent-audit/beluga-manager \
            --repo dasomel/kubemetal=/tmp/agent-audit/kubemetal \
            --repo dasomel/clusterdeck=/tmp/agent-audit/clusterdeck \
            --repo dasomel/ldapium=/tmp/agent-audit/ldapium \
            --repo dasomel/nfs-quota-agent=/tmp/agent-audit/nfs-quota-agent \
            --repo dasomel/egovframe-launcher=/tmp/agent-audit/egovframe-launcher \
            --repo dasomel/kube-ready-box=/tmp/agent-audit/kube-ready-box
          python3 templates/scripts/generate-agent-audit-matrix.py --validate
      - name: Commit generated matrix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add portfolio/agent-audit.json docs/agent-audit-matrix.md docs/agent-audit-matrix-ko.md
          git commit -m 'docs(agent): publish revision-bound portfolio audit matrix'
          git push origin HEAD:feat/agent-audit-matrix
