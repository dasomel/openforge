name: Temporary AGENT-005 Operational Reconstruction

on:
  push:
    branches: [release/agent-ops-v2]

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/agent-ops-v2
          fetch-depth: 0
      - name: Transplant operational-only layer
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/agent-ops-pilot
          git checkout origin/feat/agent-ops-pilot -- \
            .github/actions/agent-eval/action.yml \
            docs/agent-005-promotion-2026-08-ko.md \
            docs/agent-005-promotion-2026-08.md \
            docs/agent-eval-reuse-and-rollout-ko.md \
            docs/agent-eval-reuse-and-rollout.md \
            docs/agent-evaluation-adoption-2026-08-ko.md \
            docs/agent-evaluation-adoption-2026-08.md \
            docs/agent-evaluation-operations-ko.md \
            docs/agent-evaluation-operations.md \
            docs/agent-governance-release-readiness-ko.md \
            docs/agent-governance-release-readiness.md \
            docs/agent-natural-regression-evidence-2026-08-ko.md \
            docs/agent-natural-regression-evidence-2026-08.md \
            docs/agent-outcome-evidence-consistency-ko.md \
            docs/agent-outcome-evidence-consistency.md \
            docs/agent-risk-based-trace-policy-ko.md \
            docs/agent-risk-based-trace-policy.md \
            docs/agent-trace-evidence-correlation-ko.md \
            docs/agent-trace-evidence-correlation.md \
            templates/agent-eval/baseline.eval.json \
            templates/agent-eval/portfolio.pilots.yml \
            templates/agent-eval/risk-policy.json \
            templates/agent-eval/traces/2026-08-risk-based-trace-gate.json \
            templates/scripts/agent-eval-gate.py \
            templates/scripts/agent_operational_metric.py \
            templates/scripts/bind-agent-verification.py \
            templates/scripts/check-agent-trace-evidence.py \
            templates/scripts/check-agent-trace-requirement.py \
            templates/scripts/check-mutable-inputs.py \
            templates/scripts/evaluate-agent-trace.py \
            templates/scripts/record-agent-event.py \
            tests/test_agent_evaluation.py \
            tests/test_agent_operational_gate.py \
            tests/test_agent_operational_portfolio_audit.py \
            tests/test_agent_risk_trace_gate.py \
            tests/test_agent_trace_evidence.py \
            tests/test_agent_verification_binding.py \
            tests/test_behavior_portfolio_audit.py \
            tests/test_mutable_inputs.py
      - name: Register AGENT-005 on current audit engine
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('templates/scripts/audit-portfolio.py')
          text = p.read_text()
          marker = '\n\nif __name__ == "__main__":\n    main()\n'
          block = '''\ndef _register_agent_operational_metric() -> None:\n    """Attach additive AGENT-005 without replacing the current audit core."""\n    import importlib.util\n    from types import SimpleNamespace\n\n    module_path = Path(__file__).with_name("agent_operational_metric.py")\n    spec = importlib.util.spec_from_file_location("openforge_agent_operational_metric", module_path)\n    module = importlib.util.module_from_spec(spec)\n    assert spec.loader is not None\n    spec.loader.exec_module(module)\n\n    core = SimpleNamespace(\n        METRIC_DEFINITIONS=METRIC_DEFINITIONS,\n        RepoAuditor=RepoAuditor,\n        validate_portfolio_config=validate_portfolio_config,\n        run_portfolio_audit=run_portfolio_audit,\n        compare_with_baseline=compare_with_baseline,\n    )\n    module.register(core)\n    globals()["validate_portfolio_config"] = core.validate_portfolio_config\n    globals()["run_portfolio_audit"] = core.run_portfolio_audit\n    globals()["compare_with_baseline"] = core.compare_with_baseline\n\n\n_register_agent_operational_metric()\n'''
          if '_register_agent_operational_metric()' not in text:
              if marker not in text:
                  raise SystemExit('audit-portfolio.py main marker not found')
              text = text.replace(marker, '\n' + block + marker)
              p.write_text(text)

          t = Path('tests/test_portfolio_audit.py')
          s = t.read_text()
          s = s.replace('Verify all 36 standard metrics', 'Verify all 37 standard metrics')
          s = s.replace('self.assertEqual(len(metrics), 36, f"Expected exactly 36 metrics, got {len(metrics)}")', 'self.assertEqual(len(metrics), 37, f"Expected exactly 37 metrics, got {len(metrics)}")')
          s = s.replace('self.assertEqual(res["metrics"]["totalDefined"], 36)', 'self.assertEqual(res["metrics"]["totalDefined"], 37)')
          t.write_text(s)
          PY
      - name: Verify operational layer
        shell: bash
        run: |
          set -euo pipefail
          bash templates/scripts/validate-behaviors.sh
          python3 -m unittest discover -s tests -v
          python3 templates/scripts/audit-portfolio.py --config tests/fixtures/compliance/portfolio.yml --summary-only
          python3 templates/scripts/agent-eval-gate.py \
            --trace templates/agent-eval/traces/2026-08-risk-based-trace-gate.json \
            --baseline templates/agent-eval/baseline.eval.json \
            --current-out /tmp/agent-eval.json \
            --comparison-out /tmp/agent-eval-comparison.json
      - name: Commit operational integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/actions docs templates tests
          git commit -m 'feat(agent): reconstruct AGENT-005 operational layer'
          git push origin HEAD:release/agent-ops-v2
