name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md README-ko.md LICENSE
            CONTRIBUTING.md CONTRIBUTING-ko.md
            SECURITY.md SECURITY-ko.md
            CODE_OF_CONDUCT.md CODE_OF_CONDUCT-ko.md
            .editorconfig .gitignore
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Validate Korean filename convention
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name '*_ko.md' -o -type f -name '*.ko.md' | grep -q .; then
            echo 'Legacy Korean Markdown filename detected. Use <name>-ko.md.'
            exit 1
          fi

      - name: Verify supply-chain baseline contracts
        shell: bash
        run: |
          set -euo pipefail
          bash templates/scripts/verify-supply-chain.sh

  rust-quality:
    name: rust-quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets --all-features
      - name: Release build
        run: cargo build --release --bin openforge
