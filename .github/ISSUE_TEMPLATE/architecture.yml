name: Architecture decision / 아키텍처 결정
description: Propose or document an architecture decision / 아키텍처 결정을 제안하거나 기록합니다.
labels: [architecture]
body:
  - type: textarea
    id: context
    attributes:
      label: Context / 배경
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision / 제안 결정
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 대안
  - type: textarea
    id: consequences
    attributes:
      label: Consequences / 결과 및 영향
