[package]
name = "openforge"
version = "0.1.0"
edition = "2024"
description = "Deterministic OSS and platform maturity assessment CLI"
license = "Apache-2.0"
repository = "https://github.com/dasomel/openforge"
rust-version = "1.85"

[[bin]]
name = "openforge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
