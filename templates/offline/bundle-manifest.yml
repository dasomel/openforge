# Offline Bundle Manifest
version: 1
project: project-name
release: vX.Y.Z
artifacts:
  - path: images/app.tar
    digest: sha256:REPLACE_ME
  - path: charts/app.tgz
    digest: sha256:REPLACE_ME
  - path: sbom.spdx.json
    digest: sha256:REPLACE_ME
