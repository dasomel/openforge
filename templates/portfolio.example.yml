version: openforge-portfolio/v1
workspaceRoot: "../.."

# OpenForge Portfolio Configuration Baseline
# Defines the list of active repositories evaluated by the compliance audit engine.
#
# agent_behaviors:
#   true  = AGENT-004 is required even if .agents/behaviors/ is missing
#   false = AGENT-004 is explicitly N/A
#   unset = auto-detect adoption from .agents/behaviors/

repositories:
  - id: openforge
    repository: dasomel/openforge
    path: openforge
    category: Standards & Blueprints
    archetype: Developer Tool
    profile: documentation
    ui: false
    container: false
    env: false
    agent_behaviors: true

  - id: narwhal
    repository: dasomel/narwhal
    path: idp/narwhal
    category: Internal Developer Platform
    archetype: Platform Portal
    profile: platform
    ui: false
    container: true
    env: true

  - id: narwhal-portal
    repository: dasomel/narwhal-portal
