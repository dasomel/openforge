apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: app
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

# Adapt egress destinations to the application's actual dependencies.
# Do not copy this policy unchanged into a service that needs external APIs.
