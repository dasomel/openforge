name: Release Security Baseline

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@<APPROVED_IMMUTABLE_REVISION>

      - name: Release gate checklist
        shell: bash
        run: |
          set -euo pipefail
          echo "Release security baseline"
          echo "1. Verify source/ref"
          echo "2. Verify dependency lock/integrity"
          echo "3. Build in clean environment"
          echo "4. Generate and verify SBOM/provenance"
          echo "5. Freeze artifact digest"
          echo "6. Apply project approval/publish policy"
          echo "7. Re-verify published artifact"

# Replace APPROVED_IMMUTABLE_REVISION with the exact approved commit SHA.
# Do not grant id-token: write or registry publish permissions unless the
# publish job explicitly requires them.
