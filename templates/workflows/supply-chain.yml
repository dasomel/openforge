name: OpenForge Supply Chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@<APPROVED_IMMUTABLE_REVISION>
        with:
          fetch-depth: 0

      - name: Verify repository supply-chain contracts
        shell: bash
        run: |
          set -euo pipefail
          ./templates/scripts/verify-supply-chain.sh

      - name: Verify changed workflow/toolchain impact
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -Eq '(^|/)(package.json|.*lock|.*Dockerfile|.*\.ya?ml)$'; then
            test -f docs/change-management.md
            grep -q 'inspect **all workflows**' docs/change-management.md
            echo "Change-management contract present for dependency/toolchain-sensitive changes."
          fi

# Replace APPROVED_IMMUTABLE_REVISION with an approved checkout commit SHA.
# Extend this template with ecosystem-specific lockfile, SBOM, provenance,
# signature, scanner and network-sandbox checks used by the target project.
