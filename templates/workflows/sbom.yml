name: SBOM

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@<APPROVED_CHECKOUT_REVISION>

      - name: Generate SBOM
        uses: anchore/sbom-action@<APPROVED_SBOM_ACTION_REVISION>
        with:
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json

      - name: Validate SBOM exists
        shell: bash
        run: test -s sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@<APPROVED_UPLOAD_ARTIFACT_REVISION>
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error

# Pin all workflow actions to approved immutable revisions before adoption.
# Prefer publishing the SBOM alongside the release artifact and recording
# its digest in the release manifest.
